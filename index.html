<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Rei Sound Box</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px;background:linear-gradient(135deg,#171126,#30204d,#15101f);color:#fff;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif}.box{width:min(520px,100%);padding:28px 22px;border:1px solid rgba(255,255,255,.22);border-radius:24px;background:rgba(20,14,32,.82);box-shadow:0 18px 50px rgba(0,0,0,.45);text-align:center}h1{margin:0 0 24px;font-size:clamp(28px,7vw,42px);letter-spacing:.08em}.buttons{display:grid;gap:12px}button{width:100%;padding:16px 18px;border:0;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:18px;font-weight:bold;letter-spacing:.05em;cursor:pointer;transition:transform .12s,background .12s,box-shadow .12s}button:hover{background:rgba(255,255,255,.20);box-shadow:0 6px 20px rgba(0,0,0,.25)}button:active{transform:scale(.97)}#reishu.changed{background:rgba(255,180,220,.22)}</style></head><body><main class="box"><h1>Rei Sound Box</h1><div class="buttons"><button id="reishu" onclick="playReishu()">冷酒で乾杯</button><button onclick="playSound('sandoriyon.wav')">サンドリヨン</button><button onclick="playSound('tasukaran.wav')">枠外たすからん</button><button onclick="playSound('reikyokon.wav')">れい教魂！</button><button onclick="playSound('matsuaki.wav')">まつあきの歌</button><button onclick="playSound('hamaguri.wav')">ハマグリROCK</button><button onclick="playSound('kawanonakani.wav')">川の中に…</button><button onclick="playSound('fujiwara.wav')">藤原</button></div></main><script>let reishuCount=0;function playSound(file){const audio=new Audio(file);audio.play().catch(()=>alert('音声ファイルを確認してください：'+file));}function playReishu(){reishuCount++;if(reishuCount>=5){const button=document.getElementById('reishu');button.textContent='お前のいいね！冷酒で乾杯！';button.classList.add('changed');playSound('reishu_after5.wav')}else{playSound('reishu.wav')}}</script></body></html>
